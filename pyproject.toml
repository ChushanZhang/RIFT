[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rift-wam"
version = "0.1.0"
description = "RIFT flow-matching training code derived from FastWAM"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = [
  "LICENSE",
  "LICENSES/*.txt",
]
dependencies = [
  "accelerate==1.12.0",
  "av==16.0.1",
  "datasets==3.6.0",
  "deepspeed==0.19.1",
  "einops==0.8.1",
  "huggingface-hub==0.36.2",
  "hydra-core==1.3.2",
  "jsonlines==4.0.0",
  "modelscope==1.34.0",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "packaging==25.0",
  "pillow==12.0.0",
  "pyarrow==23.0.0",
  "pyyaml==6.0.3",
  "regex==2025.11.3",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "torch==2.7.1+cu128",
  "torchcodec==0.5",
  "torchvision==0.22.1+cu128",
  "tqdm==4.66.5",
  "transformers==4.49.0",
  "typing-extensions==4.15.0",
  "wandb==0.23.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["rift*"]
